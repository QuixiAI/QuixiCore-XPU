schema_version: 0.2
backend: xpu
status_values:
  - implemented
  - partial
  - experimental
  - planned
  - unsupported
  - capability_gated
layout: canonical_variants
# Each op ships one or more implementation variants. Native SYCL and the vendor
# (oneDNN) path are co-equal, selectable at the ABI (quixicore::xpu::Variant),
# analogous to the Metal backend's co-equal PyTorch and MLX bindings.
variant_path_rule: kernels/<family>/<operation>/variants/xpu_<target>
differentiation:
  automatic_autograd: false
  explicit_backward_operations: [gelu_backward]
  scope: inference_first
  note: >-
    Forward operators require caller-managed gradients; training-complete
    coverage is not claimed.
families:
  norms:
    status: partial
    paths:
      - kernels/norms
  activations:
    status: partial
    paths:
      - kernels/activations
  attention:
    status: partial
    paths:
      - kernels/attention
  linear_attention:
    status: partial
    paths:
      - kernels/linear_attention
  ssm:
    status: partial
    paths:
      - kernels/ssm
  matmul:
    status: partial
    paths:
      - kernels/matmul
  quantization:
    status: partial
    paths:
      - kernels/quantization
  moe:
    status: partial
    paths:
      - kernels/moe
  sampling:
    status: partial
    paths:
      - kernels/sampling
  serving:
    status: partial
    paths:
      - kernels/serving
  optimizers:
    status: partial
    paths:
      - kernels/optimizers
  collectives:
    status: capability_gated
    paths:
      - kernels/collectives
      - src/dispatch/collectives.cpp
    note: >-
      Capturable P2P sum all-reduce (one-shot + two-shot) across the 4x B60,
      bitwise-identical on every rank; requires >1 GPU launched concurrently.
      oneCCL vendor variant deferred.
  utils:
    status: partial
    paths:
      - kernels/utils
operations:
  gelu:
    family: activations
    status: implemented
    path: kernels/activations/gelu
    dtypes: [f32, f16, bf16]
    tests:
      correctness: tests/xpu_ops_smoke.cpp
    benchmarks:
      default: perf/configs/activations_gelu.yaml
    variants:
      - name: xpu_sycl
        status: implemented
        path: kernels/activations/gelu/variants/xpu_sycl
      - name: xpu_onednn
        status: implemented
        path: kernels/activations/gelu/variants/xpu_onednn
  softmax:
    family: activations
    status: implemented
    path: kernels/activations/softmax
    dtypes: [f32, f16, bf16]
    tests:
      correctness: tests/xpu_ops_smoke.cpp
    variants:
      - name: xpu_sycl
        status: implemented
        path: kernels/activations/softmax/variants/xpu_sycl
      - name: xpu_onednn
        status: implemented
        path: kernels/activations/softmax/variants/xpu_onednn
  silu:
    family: activations
    status: implemented
    path: kernels/activations/silu
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/activations/silu/variants/xpu_sycl}
  gelu_backward:
    family: activations
    status: implemented
    direction: backward
    path: kernels/activations/gelu_backward
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    bindings: {pytorch: bindings/pytorch/tk_xpu_ext.sycl}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/activations/gelu_backward/variants/xpu_sycl}
  glu:
    family: activations
    status: implemented
    path: kernels/activations/glu
    dtypes: [f32, f16, bf16]
    modes: [swiglu, geglu, reglu, glu]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/activations/glu/variants/xpu_sycl}

  glu_gelu_f16:
    family: activations
    status: implemented
    path: kernels/activations/glu
    dtypes: [f32, f16, bf16]
    shape: GEGLU -> f16
    note: >-
      GEGLU (tanh-gelu gate x value) with a fused f16 output -- the f16-context
      variant of glu, mirroring attention_f16ctx. Input [rows, 2*d] (gate half
      then value half, same layout as glu), output [rows, d] always f16:
      out = f16(gelu_tanh(gate) * value). Uses the tanh GELU approximation
      (matching the embeddinggemma.c source), NOT the erf GELU of glu mode=geglu.
      Ported from embeddinggemma.c engine_xpu.cpp launch_up_gate_gelu_half;
      kernels.c ei_gelu_tanh / ei_gelu_mul_inplace is the fp64 oracle.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel glu_gelu_f16 --approx {fused,unfused}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/activations/glu/variants/xpu_sycl}
  rms_norm:
    family: norms
    status: implemented
    path: kernels/norms/rms_norm
    dtypes: [f32, f16, bf16]
    tests:
      correctness: tests/xpu_ops_smoke.cpp
    variants:
      - name: xpu_sycl
        status: implemented
        path: kernels/norms/rms_norm/variants/xpu_sycl
      # No oneDNN RMSNorm primitive; vendor/best resolve to xpu_sycl.
  fused_add_rms_norm:
    family: norms
    status: experimental
    path: kernels/norms/rms_norm
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {default: perf/configs/serving_qwen_decode.yaml}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/norms/rms_norm/variants/xpu_sycl}

  mqa_logits:
    family: serving
    status: experimental
    path: kernels/serving/mqa_logits
    dtypes: [f32]
    shape: fp8 MQA indexer logits (DeepSeek sparse-attention scoring)
    note: >-
      logits[s,kv] = sum_h w[s,h] * relu((q[s,h,:] . kv[kv,:]) * kv_scale[kv])
      with -inf outside [ks,ke); e4m3 inputs decoded to bf16 for the DPAS.
      First consumer of the native joint_matrix building block
      (kernels/common/xmx_tile.hpp) — correctness-proven, throughput pass
      pending (see optimization_status). Paged variant follows with the
      paged-attention work. Satisfies the quantized_attention /
      indexer scoring surface.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel mqa_logits --M S --rows H --dim D --N Skv"}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/serving/mqa_logits/variants/xpu_sycl}
  glu_quant:
    family: activations
    status: implemented
    path: kernels/activations/glu_quant
    dtypes: [f32, f16, bf16]
    shape: fused SwiGLU + fp8/mxfp4 activation quantization
    note: >-
      y = silu(gate) * value in fp32 from the [rows, 2d] glu layout, then
      per-group dynamic e4m3 (fp32 scales, group divides d) or mxfp4
      (per-32-group power-of-two scale + packed e2m1). Scale rules shared
      with norm_quant; encode steps integer-exact. Chains match
      vllm-xpu-kernels fused_silu_mul_{block,mxfp4}_quant (translated).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel glu_quant --rows R --dim D --approx {fp8,mxfp4}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/activations/glu_quant/variants/xpu_sycl}
  norm_quant:
    family: norms
    status: implemented
    path: kernels/norms/norm_quant
    dtypes: [f32, f16, bf16]
    shape: fused RMSNorm + fp8/mxfp4 activation quantization
    note: >-
      Modes static_fp8 (caller device-scalar scale), dynamic_fp8 (per-row
      scale = max(absmax/448, 1/(448*512))), and mxfp4 (per-32-group fp32
      power-of-two scale + packed e2m1 nibbles, element 2i low). A non-null
      residual is added IN PLACE first with the dtype-rounded read-back
      feeding the variance — that form satisfies the residual_rms_norm_quant
      contract. e4m3/e2m1 encode steps are integer-exact (shared codec);
      chains match vllm-xpu-kernels layernorm_quant + mxfp4_quant
      (translated). Per-block fp8 quant (DeepSeek-style) remains planned.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel norm_quant --rows R --dim H --approx {static,dynamic,mxfp4}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/norms/norm_quant/variants/xpu_sycl}
  group_rms_norm_gated:
    family: norms
    status: implemented
    path: kernels/norms/rms_norm
    dtypes: [f32, f16, bf16]
    shape: x * silu(gate) + per-group RMSNorm + weight
    note: >-
      The Mamba-2 mixer output norm (vLLM Mixer2RMSNormGated semantics,
      single-device): fp32 gating, variance per hidden/n_groups slice,
      round-to-dtype before the weight multiply, rms_norm=false passthrough.
      The tensor-parallel n_groups==1 cross-rank reduction is
      integration-owned. Closes the last eager-torch op in the XPU Mamba
      decode path.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel group_rms_norm_gated --rows R --dim H --N groups"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/norms/rms_norm/variants/xpu_sycl}
  rms_residual_next:
    family: norms
    status: implemented
    path: kernels/norms/rms_norm
    dtypes: [f32, f16, bf16]
    shape: residual-add + double RMSNorm -> f16
    note: >-
      Fused residual-add + double RMSNorm with f16 convert. Extends
      fused_add_rms_norm to the transformer layer boundary: RMS-normalize the
      sublayer output (projection) by post_weight, add it into the residual
      stream (in place), then RMS-normalize the updated residual by next_weight
      for the next layer and convert to f16 -- one launch in place of the
      post-norm + residual add + next pre-norm + f16 convert (~2 launches/layer
      saved). Ported from embeddinggemma.c engine_xpu.cpp
      launch_rms_residual_next_half (clean subgroup form) with kernels.c
      ei_rms_norm_residual_inplace / ei_rms_norm as the fp64 oracle.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel rms_residual_next --approx {fused,unfused}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/norms/rms_norm/variants/xpu_sycl}
  dense_gemm:
    family: matmul
    status: implemented
    path: kernels/matmul/dense_gemm
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/matmul/dense_gemm/variants/xpu_sycl}
      - {name: xpu_onednn, status: implemented, path: kernels/matmul/dense_gemm/variants/xpu_onednn}
  sample_categorical:
    family: sampling
    status: implemented
    path: kernels/sampling/sample
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/sampling/sample/variants/xpu_sycl}
  top_k_sample:
    family: sampling
    status: implemented
    path: kernels/sampling/sample
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/sampling/sample/variants/xpu_sycl}
  quantize_int4_group:
    family: quantization
    status: implemented
    path: kernels/quantization/quantize
    dtypes: [f32, f16, bf16]
    quant_format: int4_group
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/quantize/variants/xpu_sycl}
  act_quant_int8:
    family: quantization
    status: implemented
    path: kernels/quantization/act_quant
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/act_quant/variants/xpu_sycl}
  qgemv_int4:
    family: quantization
    status: implemented
    path: kernels/quantization/qgemv
    dtypes: [f32, f16, bf16]
    quant_format: int4_group
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/qgemv/variants/xpu_sycl}
  w4a16_gemm:
    family: quantization
    status: implemented
    path: kernels/quantization/w4a16_gemm
    dtypes: [f16, bf16]
    quant_format: int4_group
    shape: int4-weight x f16/bf16-activation DPAS GEMM (small-M decode)
    note: >-
      W4A16 GEMM on the Xe tensor engine (DPAS via SYCL joint_matrix):
      C[M,N] = A[M,K] . dequant(W)^T, W [N,K] int4 group-quant (the qgemv_int4 /
      quantize_int4_group encoding), A/C 16-bit float. One subgroup owns an
      8x16 output tile; the weight tile is dequantized on the fly into SLM and
      fed to joint_matrix as the B operand, fp32 accumulation. The batched
      analogue of qgemv_int4 -- the genuinely missing int4-weight DPAS shape
      (the box had int4 only as a batch-1 GEMV and int8 GEMM without DPAS).
      Written natively against SYCL joint_matrix, NOT the embeddinggemma.c
      EI_XPU_XE2_W4 path's cutlass-sycl / cute xe_gemm_4bits (no external GEMM
      library pulled in). fp64 oracle vs the CPU q4 dequant reference.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel w4a16_gemm --M M --N N --K K"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/w4a16_gemm/variants/xpu_sycl}
  qgemm_int8:
    family: quantization
    status: implemented
    path: kernels/quantization/qgemm
    dtypes: [f32, f16, bf16]
    quant_format: int8_w8a8
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/qgemm/variants/xpu_sycl}
      - {name: xpu_onednn, status: implemented, path: kernels/quantization/qgemm/variants/xpu_onednn}
  mxfp4_gemv:
    family: quantization
    status: implemented
    path: kernels/quantization/mxfp4_gemv
    dtypes: [f32, f16, bf16]
    quant_format: mxfp4
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/mxfp4_gemv/variants/xpu_sycl}
  gguf_gemv:
    family: quantization
    status: implemented
    path: kernels/quantization/gguf_gemv
    dtypes: [f32, f16, bf16]
    quant_format: gguf
    gguf_types: [q8_0, q4_0, q4_1, q5_0, q5_1, q6_K, q4_K, q5_K, q2_K, q3_K, iq4_nl, iq4_xs, iq2_xxs, iq2_xs, iq3_xxs, iq1_s]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/gguf_gemv/variants/xpu_sycl}
  nvfp4_gemv:
    family: quantization
    status: implemented
    path: kernels/quantization/nvfp4_gemv
    dtypes: [f32, f16, bf16]
    quant_format: nvfp4
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/nvfp4_gemv/variants/xpu_sycl}
  nvfp4_gemm:
    family: quantization
    status: experimental
    path: kernels/quantization/nvfp4_gemv
    dtypes: [f32, f16, bf16]
    quant_format: nvfp4
    layouts: {activation: "[M,K]", weight: "[N,K/2]", output: "[M,N]"}
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {default: perf/configs/serving_qwen_decode.yaml}
    variants:
      - {name: xpu_sycl_row_loop, status: experimental, path: kernels/quantization/nvfp4_gemv/variants/xpu_sycl}
      - {name: xpu_sycl_mtiled, status: experimental, path: kernels/quantization/nvfp4_gemv/variants/xpu_sycl, note: "Measured research path; not selected at M=1,4,8"}
  fp8_gemm:
    family: quantization
    status: experimental
    path: kernels/quantization/fp8_gemm
    quant_format: fp8
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    note: Correct on B60 (e4m3/e5m2) but not hardware-accelerated this generation.
    variants:
      - {name: xpu_onednn, status: experimental, path: kernels/quantization/fp8_gemm/variants/xpu_onednn}
  fp8_gemm_w8a16:
    family: quantization
    status: experimental
    path: kernels/quantization/fp8_gemm
    quant_format: fp8
    dtypes: [f32, f16, bf16]
    layouts: {activation: "[M,K]", weight: "[N,K]", output: "[M,N]"}
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {default: perf/configs/serving_qwen_decode.yaml}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/quantization/fp8_gemm/variants/xpu_sycl}
      - {name: xpu_onednn, status: experimental, path: kernels/quantization/fp8_gemm/variants/xpu_onednn}
  turboquant:
    family: quantization
    status: implemented
    path: kernels/quantization/turboquant
    dtypes: [f32, f16, bf16]
    quant_format: turboquant
    shape: KV-cache codec (encode + decode), format version 2
    note: >-
      One work-item per (token, head) row — the LSB-first bit stream and the
      sequential fp32 group reductions make row ownership the exactness
      contract. The per-row codec (turboquant_codec.hpp) is shared verbatim
      with the host oracle, with manual integer fp32<->fp16 conversions (the
      device optimizer elides compiler half round-trips). Caller-supplied
      Lloyd-Max centroids (turboquant_tables.hpp) and sign vector; slot < 0
      skips (encode) / zeros (decode). head_size {64,128,256}, bits [2,8];
      out-of-envelope shapes rejected without launching. Graph-capture-safe.
      Norm correction is not yet exposed (ABI addition when needed).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel turboquant --M tokens --dim head_size --K kb*10+vb"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/quantization/turboquant/variants/xpu_sycl}
  selective_scan:
    family: ssm
    status: implemented
    path: kernels/ssm/selective_scan
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/ssm/selective_scan/variants/xpu_sycl}
  ssd_decode:
    family: ssm
    status: implemented
    path: kernels/ssm/ssd
    dtypes: [f32, f16, bf16]
    shape: Mamba-2 SSD selective-state-update decode (scalar-A-per-head)
    note: >-
      One work-group per (batch, head), one lane per headdim state row; fp32
      recurrence, independent activation/state dtypes, strided state views
      (element strides s0..s3), copy-on-write src/dst slot indices with -1
      null-slot semantics (null src emits zeros and touches no state).
      Graph-capture-safe. Adapted from the QuixiAI MIT decode kernel set
      proven in vLLM XPU serving (NemotronH decode path).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel ssd_decode --M batch --N slots"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/ssm/ssd/variants/xpu_sycl}
  ssd_prefill:
    family: ssm
    status: implemented
    path: kernels/ssm/ssd
    dtypes: [f32, f16, bf16]
    shape: varlen Mamba-2 SSD prefill selective scan
    note: >-
      Sequential-over-tokens variant (xpu_sycl_seq): one work-group per
      (seq, head), one lane per headdim row with its dstate state row in SLM;
      fp32 recurrence with softplus + dt_limit clamp; cu_seqlens varlen with
      empty sequences passing state through. Initial states are caller-
      pre-gathered and final states caller-scattered (keeps the kernel free of
      slot indirection and capture-safe). Requires headdim*dstate*4 B SLM and
      headdim lanes per work-group; out-of-envelope shapes rejected without
      launching. A chunked parallel-scan variant is the planned throughput
      upgrade. Adapted from the QuixiAI MIT decode kernel set proven in vLLM
      XPU serving (NemotronH prefill path).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel ssd_prefill --M tokens --rows seqs"}
    variants:
      - {name: xpu_sycl_seq, status: implemented, path: kernels/ssm/ssd/variants/xpu_sycl}
  causal_conv1d_prefill:
    family: ssm
    status: implemented
    path: kernels/ssm/causal_conv1d
    dtypes: [f32, f16, bf16]
    shape: varlen depthwise causal conv prefill (dim-major layout)
    note: >-
      Two chained kernels (output pass, then state write-back gathering the
      last state_len samples of [initial_state | seq_x]); the event dependency
      guarantees old-window reads precede writes. cu_seqlens varlen with empty
      sequences leaving slots untouched, has_init per sequence, -1 null slots,
      dim-major strided x/out. Same kernel <= 8 envelope as the decode op.
      Graph-capture-safe. Adapted from the QuixiAI MIT decode kernel set
      proven in vLLM XPU serving (NemotronH prefill conv stage).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel causal_conv1d_prefill --M tokens --dim channels"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/ssm/causal_conv1d/variants/xpu_sycl}
  causal_conv1d_decode:
    family: ssm
    status: implemented
    path: kernels/ssm/causal_conv1d
    dtypes: [f32, f16, bf16]
    shape: depthwise width-<=8 causal conv decode update
    note: >-
      One work-item per (batch, channel); kernel-tap correlation over the
      rolling conv-state window, optional SiLU, in-place shift-append state
      update. Independent act/state dtypes; dim-major and len-major serving
      layouts via element strides cs0..cs2; -1/out-of-range slots emit zeros
      and touch no state. Requires kernel == state_len+1 and kernel <= 8
      (register window); out-of-envelope shapes are rejected without
      launching. Graph-capture-safe. Adapted from the QuixiAI MIT decode
      kernel set proven in vLLM XPU serving (NemotronH conv stage).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel causal_conv1d_decode --M batch --dim channels"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/ssm/causal_conv1d/variants/xpu_sycl}
  linear_attn:
    family: linear_attention
    status: implemented
    path: kernels/linear_attention/linear_attn
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/linear_attention/linear_attn/variants/xpu_sycl}
  gdn_l2norm_qk:
    family: linear_attention
    status: implemented
    path: kernels/linear_attention/gated_delta_rule
    dtypes: [f32, f16, bf16]
    shape: in-place per-head L2 normalize (GDN pre-step)
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/linear_attention/gated_delta_rule/variants/xpu_sycl}
  gated_delta_rule_varlen:
    family: linear_attention
    status: implemented
    path: kernels/linear_attention/gated_delta_rule
    dtypes: [f32, f16, bf16]
    shape: varlen gated delta rule, exact recurrence (prefill + decode)
    note: >-
      One work-group per (sequence, v head), lane-per-v-dim register state
      rows, SLM-staged q/k per token; beta = sigmoid(b), g = exp(-exp(A_log)
      * softplus(a + dt_bias)); GQA hv->hk map; cu_seqlens varlen with empty
      sequences; state read at state_indices (zero when has_initial_state is
      false), written back in place; null slots emit zeros. dk <= 128.
      Unlocks GDN beyond the shape-locked qwen_gdn_decode; the width-4 conv
      is causal_conv1d_prefill/decode with token-major strides. The
      chunked-DPAS prefill pipeline is the deferred perf variant (>= 2.5x
      gate, caller workspaces). Graph-capture-safe.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel gated_delta_rule --M tokens"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/linear_attention/gated_delta_rule/variants/xpu_sycl}
  qwen_gdn_decode:
    family: linear_attention
    status: experimental
    path: kernels/linear_attention/qwen_gdn_decode
    dtypes: [f32, f16, bf16]
    scope: qwen3_5_qwen3_6_non_interleaved_decode
    note: >-
      State slots in [0,slots) are valid; invalid slots preserve z and skip
      state mutation.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {default: perf/configs/serving_qwen_decode.yaml}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/linear_attention/qwen_gdn_decode/variants/xpu_sycl}
  moe_route_topk:
    family: moe
    status: implemented
    path: kernels/moe/moe_route
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/moe/moe_route/variants/xpu_sycl}
  moe_grouped_qgemm:
    family: moe
    status: experimental
    path: kernels/moe/grouped_qgemm
    dtypes: [f16, bf16]
    shape: segmented per-expert GEMM with fused weight dequant (grouped_gemm / moe_grouped_qgemm / moe_grouped_qswiglu)
    note: >-
      Rows sorted by expert + device rows_per_expert [E] (never host-read);
      static worst-case grid with an on-device segment walk
      (graph-capture-safe, zeros/empty experts fine). Formats: w16, int4
      group (f16 scales), nvfp4 (e2m1 + LINEAR de-swizzled e4m3 16-block
      scales + per-expert f32 global scale applied exactly in the fp32
      epilogue). moe_grouped_qswiglu ships as the composite (qgemm ->
      caller scratch [M,2I] -> glu swiglu). HONEST STANDING: correct and
      contract-closing but not yet a throughput winner — the scalar
      stage-lambda dequant is ALU-bound (see optimization_status); the
      nvfp4_moe GEMV split remains the production route until the recorded
      levers land. fp8/mxfp4 formats + the fused swiglu follow with that
      throughput pass.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel moe_grouped_qgemm --M rows --dim N --K K --N experts"}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/moe/grouped_qgemm/variants/xpu_sycl}
  nvfp4_moe:
    family: moe
    status: experimental
    path: kernels/moe/nvfp4_moe
    dtypes: [f32, f16, bf16]
    quant_format: nvfp4
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {default: perf/configs/serving_qwen_decode.yaml}
    variants:
      - {name: xpu_sycl_fused, status: experimental, path: kernels/moe/nvfp4_moe/variants/xpu_sycl}
      - {name: xpu_sycl_split, status: experimental, path: kernels/moe/nvfp4_moe/variants/xpu_sycl}
      - name: xpu_sycl_relu2_fused
        status: experimental
        path: kernels/moe/nvfp4_moe/variants/xpu_sycl
        note: >-
          ReLU²-ungated NemotronH experts: w1 is a single up-projection
          [E,I,K/2] and the activation is relu(g)^2 with no gate multiply.
          Ported back from the vLLM XPU serving prototype (dffcab7).
      - name: xpu_sycl_relu2_split
        status: experimental
        path: kernels/moe/nvfp4_moe/variants/xpu_sycl
        note: Two-stage relu2 form; caller scratch [M*top_k, I]. Preferred at decode.
  all_reduce:
    family: collectives
    status: capability_gated
    path: kernels/collectives/all_reduce
    dtypes: [f32, f16, bf16]
    shape: capturable P2P sum all-reduce (world 2..8)
    note: >-
      One-shot (latency-bound) and two-shot (reduce-scatter + all-gather)
      algorithms over peer-visible [signal | staging] regions; fp32 FIXED
      rank-order accumulation so every rank produces bitwise-identical
      results; volatile-store + system-fence flag protocol (B60 reports peer
      access without peer atomics); device-resident generation counters make
      the handshake graph-replay-safe; bounded spins degrade a broken
      handshake to a caught error instead of a device hang. Requires >1 GPU
      with every rank launching concurrently. Region sizing via
      ops::all_reduce_region_bytes; the cross-process fd exchange is
      integration-owned. Semantics shared with vLLM's proven custom
      all-reduce; independently expressed.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel all_reduce --n numel --dtype dt"}
    variants:
      - {name: xpu_sycl, status: capability_gated, path: kernels/collectives/all_reduce/variants/xpu_sycl}
  dropout:
