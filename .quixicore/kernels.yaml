    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/serving/variants/xpu_sycl}
  pool_mean_rms_l2:
    family: serving
    status: implemented
    path: kernels/serving
    dtypes: [f32, f16, bf16]
    shape: masked-mean + per-token RMSNorm + L2 pooling head
    shape_keys: {dim: [256, 512, 768, 1024]}
    note: >-
      Sentence-embedding pooling head. One kernel fuses per-token RMSNorm (learned
      weight), a masked mean over each sequence's token range (CSR offsets), and a
      final L2 normalize -- reading the token embeddings once and writing one
      vector per sequence. One subgroup owns each sequence's dim-vector; dim is a
      compile-time shape key. Ported from embeddinggemma.c's engine_xpu.cpp
      launch_pool / kernels.c ei_mean_pool_rms_l2 (fp64 oracle).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel pool_mean_rms_l2 --approx {fused,unfused}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/serving/variants/xpu_sycl}
  attention:
    family: attention
    status: implemented
    path: kernels/attention/attention
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/attention/attention/variants/xpu_sycl}
  attention_f16ctx:
    family: attention
    status: implemented
    path: kernels/attention/attention
    dtypes: [f32, f16, bf16]
    shape: online-attention + fused f16 context store
    note: >-
      Flash SDPA whose epilogue also writes a rounded f16 copy of the output
      (O_f16), folding the ctx->f16 convert a downstream attention-output GEMM
      needs into the attention pass. Ported from embeddinggemma.c's
      EI_XPU_FUSE_ATTN_OUTPUT_HALF online-attention epilogue.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel attention_f16ctx --approx {fused,unfused}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/attention/attention/variants/xpu_sycl}
  attn_swa:
    family: attention
    status: implemented
    path: kernels/attention/attention
    dtypes: [f32, f16, bf16]
    shape: symmetric sliding-window, GQA, D<=256
    note: >-
      Flash online-softmax SDPA whose mask is a SYMMETRIC sliding window instead
      of causal: query qi attends keys in [center - window/2, center + window/2]
      clamped to [0, seq_k), center = qi + (seq_k - seq_q). Unlike causal SWA the
      band looks both forward and backward -- the mask EmbeddingGemma's local
      encoder layers use in its alternating global/local stack. window == 0 is
      dense. head_dim d <= 256. Ported from embeddinggemma.c engine_xpu.cpp
      launch_attention / launch_attention_softmax_banded (the window branch);
      kernels.c ei_attention_mha_range is the fp64 oracle. The band correctness
      is proven both against the windowed reference and against a causal
      reference that it must NOT match (symmetry check).
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel attn_swa --approx {banded,dense} --window W"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/attention/attention/variants/xpu_sycl}
  rope:
    family: attention
    status: implemented
    path: kernels/attention/rope
    dtypes: [f32, f16, bf16]
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/attention/rope/variants/xpu_sycl}

  paged_attention_decode:
    family: attention
    status: experimental
    path: kernels/attention/paged_attention
    dtypes: [f32, f16, bf16]
    shape: split-KV paged KV-cache decode (contract decode_cache_attention)
    note: >-
      Subgroup-cooperative online softmax per (sequence, head, split) with
      lane-interleaved coalesced KV rows; RUNTIME page size (any value, tuned
      64) through the block table with -1 pages skipped; caller-owned
      max-shaped fp32 split workspaces + a chained LSE-merge reduction with
      optional attention sinks; window_left trailing-window trim; fp8
      e4m3/e5m2 KV via exact codecs with device-scalar scales. d <= 256,
      d % 16 == 0. Graph-capture-safe. Semantics from the cutlass
      vllm-xpu-kernels paged_decode (translated); DPAS tiling and multi-key
      unrolling are the recorded levers.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel paged_attention_decode --M B --N ctx --K splits --rows H --dim d"}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/attention/paged_attention/variants/xpu_sycl}
  paged_attention_prefill:
    family: attention
    status: experimental
    path: kernels/attention/paged_attention
    dtypes: [f32, f16, bf16]
    shape: varlen paged/dense prefill FMHA fwd (paged_attention_advanced + mixed_prefill_decode_attention)
    note: >-
      One work-item per (packed token, head) flash recurrence; cu_seqlens
      varlen, end-aligned causal, window_left/right banding (symmetric shape
      with causal=false), per-batch is_prefill mask for mixed batches,
      optional LSE (sinks included), dense fallback when block_table is null,
      fp8 KV. Correctness-first shape — prefill is compute-bound, so the
      q-block/DPAS tiling on kernels/common/xmx_tile.hpp is the priority
      lever. d <= 256. Graph-capture-safe.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel paged_attention_decode (decode); prefill sweep recorded in optimization_status"}
    variants:
      - {name: xpu_sycl, status: experimental, path: kernels/attention/paged_attention/variants/xpu_sycl}
  qk_norm_rope:
    family: norms
    status: implemented
    path: kernels/norms/qk_norm_rope
    dtypes: [f32, f16, bf16]
    shape: per-head RMSNorm + query-scale + RoPE
    note: >-
      Fused per-head QK-norm + RoPE with an optional f16 convert. For every
      (token, head) of Q and K: RMS-normalize the head-dim vector by its learned
      weight, scale query heads by query_scale (keys by 1), then apply NeoX
      half-split RoPE at position (pos0 + token) -- one launch in place of
      rms_norm(Q) + rms_norm(K) + query-scale + rope(Q) + rope(K). One subgroup
      per (token, head); GQA via n_head_kv < n_head. Ported from
      embeddinggemma.c engine_xpu.cpp launch_qk_norm_rope (the richer
      launch_qkv_epilogue, which encodes the model fused-QKV layout, was not
      ported); kernels.c ei_qk_norm_rope_qk_inplace is the fp64 oracle.
    tests: {correctness: tests/xpu_ops_smoke.cpp}
    benchmarks: {harness: "perf/harness/xpu_bench.cpp --kernel qk_norm_rope --approx {fused,unfused}"}
    variants:
      - {name: xpu_sycl, status: implemented, path: kernels/norms/qk_norm_rope/variants/xpu_sycl}
  adamw:
